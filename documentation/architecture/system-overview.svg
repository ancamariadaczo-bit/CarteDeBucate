<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-label="Carte de bucate: the system from far away">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7B8794"/></marker></defs>
<rect width="1600" height="960" fill="#FFFFFF"/>
<text x="40" y="58" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2933">Carte de bucate: the system from far away</text>
<text x="40" y="88" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#52606D">Who uses it, where it runs, what it stores and which outside services it talks to. State of main, 28 November 2026.</text>
<rect x="40" y="120" width="330" height="560" rx="18" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
<text x="58" y="148" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#475569">PEOPLE</text>
<rect x="65" y="232" width="280" height="96" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
<text x="205.0" y="274" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Person in a web browser</text>
<text x="205.0" y="298" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">uses the website</text>
<rect x="65" y="400" width="280" height="116" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
<text x="205.0" y="442" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Person with Recipe Clipper</text>
<text x="205.0" y="466" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">Chrome extension, side panel</text>
<text x="205.0" y="486" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">reads the recipe from the open page</text>
<rect x="480" y="120" width="640" height="660" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="498" y="148" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#2563EB">RENDER: ONE INSTANCE, BUILT FROM THE DOCKERFILE</text>
<rect x="510" y="170" width="580" height="270" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="800.0" y="312" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933"></text>
<text x="800" y="200" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2933">CarteDeBucate.Web</text>
<text x="800" y="222" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#52606D">ASP.NET Core MVC on .NET 10, the only thing deployed</text>
<rect x="535" y="245" width="250" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="660.0" y="274" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Website pages</text>
<text x="660.0" y="298" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">Razor, for people</text>
<rect x="535" y="340" width="250" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="660.0" y="369" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">JSON API</text>
<text x="660.0" y="393" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">for the extension</text>
<rect x="815" y="245" width="250" height="165" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="940.0" y="302" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Business rules</text>
<text x="940.0" y="326" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">accounts, recipes, import,</text>
<text x="940.0" y="346" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">photos, backup, email</text>
<text x="940.0" y="364" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">(Core and Infrastructure)</text>
<rect x="510" y="500" width="580" height="250" rx="18" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
<text x="528" y="528" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#B45309">INSTANCE DISK</text>
<rect x="535" y="548" width="165" height="100" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="617.5" y="592" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">SQLite file</text>
<text x="617.5" y="616" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">all data</text>
<rect x="717" y="548" width="165" height="100" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="799.5" y="582" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Photo files</text>
<text x="799.5" y="606" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">on disk, not in</text>
<text x="799.5" y="626" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">the database</text>
<rect x="899" y="548" width="165" height="100" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="981.5" y="582" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Backups</text>
<text x="981.5" y="606" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">daily copy,</text>
<text x="981.5" y="626" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">7 days kept</text>
<text x="800" y="690" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#B91C1C">Lost on every redeploy or restart.</text>
<text x="800" y="712" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#B91C1C">Accepted while the app is not public. To solve before go-live.</text>
<rect x="1230" y="120" width="330" height="560" rx="18" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/>
<text x="1248" y="148" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#6D28D9">OUTSIDE SERVICES</text>
<rect x="1255" y="180" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
<text x="1395.0" y="219" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Resend</text>
<text x="1395.0" y="243" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">sends the emails</text>
<rect x="1255" y="335" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
<text x="1395.0" y="374" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Recipe websites</text>
<text x="1395.0" y="398" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">pages downloaded for import</text>
<rect x="1255" y="490" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
<text x="1395.0" y="529" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Redis (optional)</text>
<text x="1395.0" y="553" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">recipe cache, 30 minutes</text>
<polyline points="345,280 533,280" fill="none" stroke="#7B8794" stroke-width="2" marker-end="url(#a)"/>
<text x="425" y="250" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">HTTPS</text>
<text x="425" y="267" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">cookie sign-in</text>
<polyline points="345,458 440,458 440,375 533,375" fill="none" stroke="#7B8794" stroke-width="2" marker-end="url(#a)"/>
<text x="425" y="350" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">HTTPS</text>
<text x="425" y="367" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1F2933">JWT, 60 minutes</text>
<polyline points="1090,225 1253,225" fill="none" stroke="#7B8794" stroke-width="2" marker-end="url(#a)"/>
<text x="1170" y="215" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">account emails</text>
<polyline points="1090,380 1253,380" fill="none" stroke="#7B8794" stroke-width="2" marker-end="url(#a)"/>
<text x="1170" y="362" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">guarded download</text>
<text x="1170" y="379" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">max 5 MiB</text>
<polyline points="1090,400 1160,400 1160,535 1253,535" fill="none" stroke="#7B8794" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="1195" y="527" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">cache</text>
<polyline points="800,440 800,498" fill="none" stroke="#7B8794" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="860" y="474" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">reads and writes</text>
<rect x="40" y="810" width="1520" height="120" rx="18" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
<text x="58" y="838" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#047857">AROUND IT</text>
<rect x="250" y="838" width="360" height="72" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="430.0" y="868" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">GitHub</text>
<text x="430.0" y="892" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">code, tests on every push and pull request</text>
<rect x="700" y="838" width="360" height="72" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="880.0" y="868" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Chrome Web Store</text>
<text x="880.0" y="892" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">extension, packed and published by hand</text>
<rect x="1150" y="838" width="360" height="72" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="1330.0" y="868" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">GitHub Pages</text>
<text x="1330.0" y="892" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">the extension&#x27;s privacy policy</text>
<polyline points="545,836 545,783" fill="none" stroke="#7B8794" stroke-width="2" marker-end="url(#a)"/>
<text x="533" y="802" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">deploys only after the checks pass</text>
</svg>
