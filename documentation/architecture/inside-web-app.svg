<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" role="img" aria-label="Carte de bucate: inside the web app">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7B8794"/></marker></defs>
<rect width="1600" height="1060" fill="#FFFFFF"/>
<text x="40" y="58" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2933">Carte de bucate: inside the web app</text>
<text x="40" y="88" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#52606D">The projects of the solution, what each one is responsible for, and the direction of dependencies. State of main, 28 November 2026.</text>
<rect x="40" y="120" width="1160" height="300" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="58" y="148" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#2563EB">CARTEDEBUCATE.WEB: RECEIVES REQUESTS, HOLDS NO BUSINESS RULES</text>
<rect x="65" y="170" width="350" height="105" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="240.0" y="207" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Website controllers</text>
<text x="240.0" y="231" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">Home, Account, Recipes, RecipePhotos,</text>
<text x="240.0" y="250" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">RecipeBackups, Settings</text>
<rect x="435" y="170" width="350" height="105" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="610.0" y="207" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">API controllers</text>
<text x="610.0" y="231" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">AuthenticationApi, RecipesApi,</text>
<text x="610.0" y="250" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">RecipePhotosApi</text>
<rect x="805" y="170" width="370" height="105" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="990.0" y="207" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Sign-in checks on every request</text>
<text x="990.0" y="231" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">cookie or JWT, SecurityVersion,</text>
<text x="990.0" y="250" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">rate limits, antiforgery</text>
<rect x="65" y="295" width="350" height="100" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="240.0" y="330" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Account services</text>
<text x="240.0" y="354" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">registration, email change,</text>
<text x="240.0" y="372" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">email templates, links</text>
<rect x="435" y="295" width="350" height="100" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="610.0" y="339" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Current user</text>
<text x="610.0" y="363" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">ICurrentUserContext: who is asking</text>
<rect x="805" y="295" width="370" height="100" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="990.0" y="339" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">DatabaseBackupWorker</text>
<text x="990.0" y="363" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">copies the SQLite file once a day</text>
<rect x="40" y="480" width="1160" height="300" rx="18" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
<text x="58" y="508" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#047857">CARTEDEBUCATE.CORE: ALL BUSINESS RULES AND DATA ACCESS, KNOWS NOTHING ABOUT HTTP</text>
<rect x="65" y="530" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="150.0" y="564" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Authentication</text>
<text x="150.0" y="588" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">passwords,</text>
<text x="150.0" y="608" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">sessions</text>
<rect x="253" y="530" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="338.0" y="564" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Library</text>
<text x="338.0" y="588" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">recipes, search,</text>
<text x="338.0" y="608" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">paging</text>
<rect x="441" y="530" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="526.0" y="564" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Import</text>
<text x="526.0" y="588" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">from a web</text>
<text x="526.0" y="608" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">address</text>
<rect x="629" y="530" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="714.0" y="564" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Photos</text>
<text x="714.0" y="588" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">validate, store,</text>
<text x="714.0" y="608" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">reconcile</text>
<rect x="817" y="530" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="902.0" y="564" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Backup</text>
<text x="902.0" y="588" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">JSON export</text>
<text x="902.0" y="608" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">and import</text>
<rect x="1005" y="530" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="1090.0" y="564" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Email</text>
<text x="1090.0" y="588" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">IEmailSender</text>
<text x="1090.0" y="608" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">contract</text>
<rect x="65" y="655" width="540" height="100" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="335.0" y="699" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Repositories</text>
<text x="335.0" y="723" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">SQLite, one method set per user: another user&#x27;s data is &quot;not found&quot;</text>
<rect x="629" y="655" width="546" height="100" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="902.0" y="699" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">DatabaseMigrator</text>
<text x="902.0" y="723" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">numbered SQL scripts, run at start-up</text>
<rect x="1260" y="120" width="300" height="300" rx="18" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/>
<text x="1278" y="148" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#6D28D9">INFRASTRUCTURE</text>
<rect x="1280" y="170" width="260" height="70" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
<text x="1410.0" y="198" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2933">ResendEmailSender</text>
<text x="1410.0" y="222" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">real emails</text>
<rect x="1280" y="252" width="260" height="70" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
<text x="1410.0" y="280" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2933">InMemoryEmailSender</text>
<text x="1410.0" y="304" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">when Resend is off</text>
<rect x="1280" y="334" width="260" height="70" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
<text x="1410.0" y="362" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2933">RedisRecipeCacheService</text>
<text x="1410.0" y="386" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">optional</text>
<rect x="1260" y="480" width="300" height="300" rx="18" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/>
<text x="1278" y="508" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#6D28D9">RECIPEEXTRACTION</text>
<rect x="1280" y="535" width="260" height="220" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
<text x="1410.0" y="610" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2933">HTML page to recipe</text>
<text x="1410.0" y="634" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">1. JSON-LD data in the page</text>
<text x="1410.0" y="653" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">2. otherwise read the HTML</text>
<text x="1410.0" y="672" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D"></text>
<text x="1410.0" y="691" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">no dependencies</text>
<rect x="40" y="840" width="1520" height="190" rx="18" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="868" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#B45309">STORED ON THE INSTANCE DISK</text>
<rect x="65" y="885" width="820" height="120" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="475.0" y="930" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">SQLite file</text>
<text x="475.0" y="954" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">Users · UserEmailTokens · Recipes · RecipeIngredients</text>
<text x="475.0" y="972" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">RecipeSteps · RecipePhotos (metadata only) · SchemaMigrations</text>
<rect x="915" y="885" width="620" height="120" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="1225.0" y="930" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933">Photo folders</text>
<text x="1225.0" y="954" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">staging, then final; quarantine for files that failed</text>
<text x="1225.0" y="972" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#52606D">so a crash between disk and database can be repaired</text>
<polyline points="620,420 620,478" fill="none" stroke="#7B8794" stroke-width="2" marker-end="url(#a)"/>
<text x="634" y="454" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">calls</text>
<polyline points="1260,270 1230,270 1230,450 1150,450 1150,478" fill="none" stroke="#7B8794" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="1218" y="442" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">implements Core contracts</text>
<polyline points="1200,660 1258,660" fill="none" stroke="#7B8794" stroke-width="2" marker-end="url(#a)"/>
<text x="1229" y="650" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">uses</text>
<polyline points="335,780 335,883" fill="none" stroke="#7B8794" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="349" y="816" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">SQL</text>
<polyline points="1090,780 1090,883" fill="none" stroke="#7B8794" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="1104" y="816" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#1F2933" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">files</text>
</svg>
