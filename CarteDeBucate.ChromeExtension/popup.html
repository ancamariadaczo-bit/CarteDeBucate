<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <title>Carte de Bucate</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <header class="popup-header">
        <img
            class="popup-icon"
            src="icons/icon48.png"
            alt="">

        <div>
            <h2>Carte de Bucate</h2>

            <p class="popup-description">
                Extrage rețeta din pagina curentă.
            </p>
        </div>
    </header>

    <div class="controls">
        <button id="extractButton">
            Extrage rețeta
        </button>

        <button id="printButton" hidden>
            Print / Save PDF
        </button>
    </div>

    <hr id="resultSeparator" hidden>

    <div id="result"></div>

    <script src="popup.js"></script>

</body>

</html>
