<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Recipe Clipper – Print &amp; Save Recipes</title>

    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>

    <header class="side-panel-header">
        <img class="side-panel-icon" src="icons/icon48.png" alt="">

        <div>
            <h2 data-i18n="extensionName">Recipe Clipper – Print &amp; Save Recipes</h2>

            <p class="side-panel-description" data-i18n="sidePanelDescription">
                Extract the recipe from the current page.
            </p>
        </div>
    </header>

    <div class="controls">
        <button id="editButton" data-i18n="editRecipe" hidden>
            Edit Recipe
        </button>

        <button id="printButton" data-i18n="printSavePdf" hidden>
            Print / Save PDF
        </button>

        <button id="saveButton" data-i18n="saveToCookbook" hidden disabled>
            Save to Cookbook
        </button>
    </div>

    <p id="extractionStatus" class="extraction-status" role="status" aria-live="polite" data-i18n="extractHint">
        Click the extension icon to extract a recipe from the current page.
    </p>

    <div id="authSection" class="auth-section">
        <span id="authMessage" data-i18n="signInToSave">
            Sign in to save recipes.
        </span>

        <button id="loginButton" data-i18n="logIn">
            Log in
        </button>
    </div>

    <p id="saveStatus" class="save-status" role="status" aria-live="polite"></p>

    <hr id="resultSeparator" hidden>

    <div id="result"></div>

    <script src="i18n.js"></script>
    <script src="sidepanel.js"></script>

</body>

</html>
